service: aw-auf
description: >
  Aufenthaltskarte — residence card for EU/EEA citizens and their family
  members (persons entitled to freedom of movement).

nodes:
  application_type:
    type: decision
    label: Please select your request

  nationality_group:
    type: decision
    label: I have the nationality...
  blocked_switzerland:
    type: leaf
    label: Service blocked — Swiss nationality
  blocked_non_eu_eea:
    type: leaf
    label: Service blocked — nationality outside the EU/EEA

  stay_duration:
    type: decision
    label: How long have you been staying in Germany?

  currently_employed:
    type: decision
    label: >
      (less than five years in Germany) Are you currently employed?

  previously_employed:
    type: decision
    label: Have you previously been employed in Germany or another EU/EEC country?
  blocked_never_employed:
    type: leaf
    label: Service blocked — never employed in Germany or another EU/EEC country

  retirement_reason:
    type: decision
    label: Why have you retired from working life?
  disability_pension:
    type: decision
    label: Are you entitled to a disability pension within German federal territory?
  blocked_no_disability_pension:
    type: leaf
    label: Service blocked — not entitled to a disability pension within German federal territory
  stays_and_absences_via_disability_pension:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)

  resident_two_years:
    type: decision
    label: >
      Have you been continuously resident in German federal territory for
      at least two years?
  stays_and_absences_via_two_years:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)

  blocked_no_retirement_reason_applies:
    type: leaf
    label: Service blocked — none of the retirement-reason statements apply

  resident_three_years:
    type: decision
    label: >
      Have you been continuously resident in German federal territory for
      at least three years?

  employed_last_12_months:
    type: decision
    label: >
      Have you engaged in any employment in German federal territory in
      the last twelve months?

  spouse_is_german_national:
    type: decision
    label: Is your spouse or civil partner a German national?

  spouse_lost_german_citizenship:
    type: decision
    label: >
      Did your spouse or partner lose German citizenship by marrying you
      before 31 March 1953?
  blocked_spouse_citizenship:
    type: leaf
    label: >
      Service blocked — spouse/partner did not lose German citizenship by
      marrying before 31 March 1953

  employment_location:
    type: decision
    label: Are you employed in Germany or another country?
  blocked_employed_germany:
    type: leaf
    label: Service blocked — employed in Germany
  blocked_employed_other_country:
    type: leaf
    label: Service blocked — employed outside the EU/EEA

  prior_work_duration:
    type: decision
    label: How long have you previously worked in Germany without interruption?
  blocked_short_prior_work:
    type: leaf
    label: Service blocked — less than three years of prior uninterrupted work

  residence_in_germany:
    type: decision
    label: Do you still have a residence in Germany?
  blocked_residence_no_weekly_return:
    type: leaf
    label: Service blocked — residence kept but no weekly return to Germany
  blocked_no_residence:
    type: leaf
    label: Service blocked — no residence kept in Germany

  stays_and_absences_via_five_years:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)
  stays_and_absences_via_residence:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)
  stays_and_absences_via_recent_employment:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)
  stays_and_absences_via_german_spouse:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)
  stays_and_absences_via_former_german_spouse:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)

  holds_residence_card:
    type: decision
    label: Do you already hold a residence card from a German Foreigners Registration Office?
  holds_residence_card_no_not_built:
    type: leaf
    label: Not yet built

  message_about:
    type: decision
    label: What is your message about?
  freizuegigkeitsvoraussetzungen:
    type: decision
    label: >
      (marriage/civil partnership dissolved) Do any of the following
      statements apply to you?
  blocked_freizuegigkeitsvoraussetzungen_none:
    type: leaf
    label: Service blocked — none of the statements apply

  ausnahmetatbestaende:
    type: decision
    label: Do any of the following statements apply to you? (exception grounds)
  blocked_ausnahmetatbestaende_none:
    type: leaf
    label: Service blocked — none of the statements apply

  permanently_resident_five_years:
    type: decision
    label: Have you been permanently resident in Germany for five years?
  stays_and_absences_via_ehe_lebenspartnerschaft:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)

  fortzug_reason:
    type: decision
    label: >
      (reference person moved away) Do any of the following statements
      apply to you?
  blocked_fortzug_reason_none:
    type: leaf
    label: Service blocked — none of the statements apply

  attends_educational_institution:
    type: decision
    label: >
      (I am the child of the reference person) Are you attending an
      educational institution for training purposes?
  blocked_not_attending_educational_institution:
    type: leaf
    label: Service blocked — not attending an educational institution

  resident_five_years_kind_branch:
    type: decision
    label: Have you been permanently resident in Germany for five years?
  stays_and_absences_via_kind_branch:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)

  child_attends_educational_institution:
    type: decision
    label: >
      (I am caring for the reference person's child) Does your child
      attend an educational institution for training purposes?
  blocked_child_not_attending_educational_institution:
    type: leaf
    label: Service blocked — child not attending an educational institution

  resident_five_years_guardian_branch:
    type: decision
    label: Have you been permanently resident in Germany for five years?
  stays_and_absences_via_guardian_five_years:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)

  child_is_adult:
    type: decision
    label: Is your child 18 years of age or older?
  stays_and_absences_via_child_adult:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)

  fortbestand_aufenthaltsrecht_im_todesfall:
    type: decision
    label: >
      (reference person died) Do any of the following statements apply
      to you?
  fortbestand_kind_verstorbenen_not_built:
    type: leaf
    label: Child of a deceased reference person — not yet built
  fortbestand_fuersorge_verstorbenen_not_built:
    type: leaf
    label: Caring for a child of a deceased reference person — not yet built
  blocked_fortbestand_none:
    type: leaf
    label: Service blocked — none of the statements apply

  reference_person_had_freedom_of_movement_right:
    type: decision
    label: >
      Did your reference person reside in Germany as an employee,
      trainee, self-employed person, job-seeker or service provider
      before their death?
  blocked_no_freedom_of_movement_right:
    type: leaf
    label: Service blocked — reference person had no freedom-of-movement residence status

  resided_with_reference_person_at_death:
    type: decision
    label: Were you permanently residing with your reference person at the time of death?
  blocked_not_resided_at_death:
    type: leaf
    label: Service blocked — not permanently residing with reference person at time of death
  stays_and_absences_via_death:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)

  message_about_rechts_not_built:
    type: leaf
    label: Reference person obtained permanent right of residence 5 years ago — not yet built

  residence_permit_five_years:
    type: decision
    label: Have you been in possession of a residence permit for five years?
  residence_permit_five_years_no_not_built:
    type: leaf
    label: Not yet built

  resided_five_years_with_reference_person:
    type: decision
    label: Have you continuously resided in Germany with your reference person for five years?
  stays_and_absences_via_five_year_permit:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)

  continue_staying_with_reference_person:
    type: decision
    label: >
      Would you like to continue to stay with a reference person in
      Germany who is entitled to freedom of movement?
  blocked_no_continue_staying:
    type: leaf
    label: Service blocked — doesn't want to continue staying with reference person

  reference_person_citizenship:
    type: decision
    label: What is the citizenship of your reference person?
  blocked_reference_person_other_country:
    type: leaf
    label: Service blocked — reference person has a different nationality (incl. Switzerland)

  reference_person_employed_or_looking:
    type: decision
    label: Is your reference person employed or looking for work?
  reference_person_employed_or_looking_no_not_built:
    type: leaf
    label: Not yet built

  rueckkehrerfaelle:
    type: decision
    label: >
      Your reference person is a German citizen — do any of the
      following statements apply?
  blocked_rueckkehrerfaelle_none:
    type: leaf
    label: Service blocked — none of the statements apply

  family_relationship:
    type: decision
    label: What is your family relationship with the reference person?
  blocked_family_relationship_other:
    type: leaf
    label: Service blocked — none of the family relationship statements apply

  wants_shared_dwelling:
    type: decision
    label: Do you intend to live permanently with your reference person in a shared dwelling?

  close_family_relationship:
    type: decision
    label: >
      (doesn't want to live in a shared dwelling) Do you still have a
      close family relationship with the reference person?
  blocked_no_close_family_relationship:
    type: leaf
    label: Service blocked — no close family relationship with reference person

  early_permanent_residence:
    type: decision
    label: >
      Has your reference person been in Germany for less than five years,
      and do they already have a permanent right of residence?
  stays_and_absences_via_reference_person:
    type: leaf
    label: Continues into the shared flow (acting person onward - same for both request types)

edges:
  - {from: application_type, to: nationality_group, choice: DAB, covered: false}
  - {from: application_type, to: holds_residence_card, choice: AK, covered: false}

  - {from: nationality_group, to: stay_duration, choice: eu, covered: false}
  - {from: nationality_group, to: blocked_switzerland, choice: schweiz, covered: false}
  - {from: nationality_group, to: blocked_non_eu_eea, choice: not_eu, covered: false}

  - {from: stay_duration, to: stays_and_absences_via_five_years, choice: more_than_five, covered: false}
  - {from: stay_duration, to: currently_employed, choice: less_than_five, covered: false}

  - {from: currently_employed, to: employment_location, choice: "yes", covered: false}
  - {from: currently_employed, to: previously_employed, choice: "no", covered: false}

  - {from: previously_employed, to: retirement_reason, choice: "yes", covered: false}
  - {from: previously_employed, to: blocked_never_employed, choice: "no", covered: false}

  - {from: retirement_reason, to: resident_three_years, choice: ruhestand, covered: false}
  - {from: retirement_reason, to: disability_pension, choice: unfall, covered: false}
  - {from: retirement_reason, to: resident_two_years, choice: erwerbsminderung, covered: false}
  - {from: retirement_reason, to: blocked_no_retirement_reason_applies, choice: andere, covered: false}

  - {from: disability_pension, to: stays_and_absences_via_disability_pension, choice: "yes", covered: false}
  - {from: disability_pension, to: blocked_no_disability_pension, choice: "no", covered: false}

  - {from: resident_two_years, to: stays_and_absences_via_two_years, choice: "yes", covered: false}
  - {from: resident_two_years, to: spouse_is_german_national, choice: "no", covered: false}

  - {from: resident_three_years, to: employed_last_12_months, choice: "yes", covered: false}
  - {from: resident_three_years, to: spouse_is_german_national, choice: "no", covered: false}

  - {from: employed_last_12_months, to: stays_and_absences_via_recent_employment, choice: "yes", covered: false}
  - {from: employed_last_12_months, to: spouse_is_german_national, choice: "no", covered: false}

  - {from: spouse_is_german_national, to: stays_and_absences_via_german_spouse, choice: "yes", covered: false}
  - {from: spouse_is_german_national, to: spouse_lost_german_citizenship, choice: "no", covered: false}

  - {from: spouse_lost_german_citizenship, to: stays_and_absences_via_former_german_spouse, choice: "yes", covered: false}
  - {from: spouse_lost_german_citizenship, to: blocked_spouse_citizenship, choice: "no", covered: false}

  - {from: employment_location, to: blocked_employed_germany, choice: germany, covered: false}
  - {from: employment_location, to: prior_work_duration, choice: eu_country, covered: false}
  - {from: employment_location, to: blocked_employed_other_country, choice: other_country, covered: false}

  - {from: prior_work_duration, to: residence_in_germany, choice: more_than_three, covered: false}
  - {from: prior_work_duration, to: blocked_short_prior_work, choice: less_than_three, covered: false}

  - {from: residence_in_germany, to: stays_and_absences_via_residence, choice: yes_mit_rueckkehr, covered: false}
  - {from: residence_in_germany, to: blocked_residence_no_weekly_return, choice: yes_ohne_rueckkehr, covered: false}
  - {from: residence_in_germany, to: blocked_no_residence, choice: "no", covered: false}

  - {from: holds_residence_card, to: message_about, choice: "yes", covered: false}
  - {from: holds_residence_card, to: holds_residence_card_no_not_built, choice: "no", covered: false}

  - {from: message_about, to: residence_permit_five_years, choice: neue_ak_oder_dak, covered: false}
  - {from: message_about, to: freizuegigkeitsvoraussetzungen, choice: ehe_lebenspartnerschaft, covered: false}
  - {from: message_about, to: fortzug_reason, choice: fortzug_der_bezugsperson, covered: false}
  - {from: message_about, to: fortbestand_aufenthaltsrecht_im_todesfall, choice: tod_der_bezugsperson, covered: false}
  - {from: message_about, to: message_about_rechts_not_built, choice: rechts_bezugsperson, covered: false}

  - {from: fortbestand_aufenthaltsrecht_im_todesfall, to: reference_person_had_freedom_of_movement_right, choice: mind_2_jaehriger, covered: false}
  - {from: fortbestand_aufenthaltsrecht_im_todesfall, to: reference_person_had_freedom_of_movement_right, choice: arbeitsunfall, covered: false}
  - {from: fortbestand_aufenthaltsrecht_im_todesfall, to: reference_person_had_freedom_of_movement_right, choice: eheschliessung, covered: false}
  - {from: fortbestand_aufenthaltsrecht_im_todesfall, to: fortbestand_kind_verstorbenen_not_built, choice: kind_verstorbenen, covered: false}
  - {from: fortbestand_aufenthaltsrecht_im_todesfall, to: fortbestand_fuersorge_verstorbenen_not_built, choice: fuersorge_verstorbenen, covered: false}
  - {from: fortbestand_aufenthaltsrecht_im_todesfall, to: blocked_fortbestand_none, choice: keine, covered: false}

  - {from: reference_person_had_freedom_of_movement_right, to: resided_with_reference_person_at_death, choice: "yes", covered: false}
  - {from: reference_person_had_freedom_of_movement_right, to: blocked_no_freedom_of_movement_right, choice: "no", covered: false}

  - {from: resided_with_reference_person_at_death, to: stays_and_absences_via_death, choice: "yes", covered: false}
  - {from: resided_with_reference_person_at_death, to: blocked_not_resided_at_death, choice: "no", covered: false}

  - {from: fortzug_reason, to: attends_educational_institution, choice: kind, covered: false}
  - {from: fortzug_reason, to: child_attends_educational_institution, choice: sorgeberechtigter_elternteil, covered: false}
  - {from: fortzug_reason, to: blocked_fortzug_reason_none, choice: keine, covered: false}

  - {from: attends_educational_institution, to: resident_five_years_kind_branch, choice: "yes", covered: false}
  - {from: attends_educational_institution, to: blocked_not_attending_educational_institution, choice: "no", covered: false}

  - {from: resident_five_years_kind_branch, to: stays_and_absences_via_kind_branch, choice: "yes", covered: false}
  - {from: resident_five_years_kind_branch, to: stays_and_absences_via_kind_branch, choice: "no", covered: false}

  - {from: child_attends_educational_institution, to: resident_five_years_guardian_branch, choice: "yes", covered: false}
  - {from: child_attends_educational_institution, to: blocked_child_not_attending_educational_institution, choice: "no", covered: false}

  - {from: resident_five_years_guardian_branch, to: stays_and_absences_via_guardian_five_years, choice: "yes", covered: false}
  - {from: resident_five_years_guardian_branch, to: child_is_adult, choice: "no", covered: false}

  - {from: child_is_adult, to: stays_and_absences_via_child_adult, choice: "yes", covered: false}
  - {from: child_is_adult, to: stays_and_absences_via_child_adult, choice: "no", covered: false}

  - {from: freizuegigkeitsvoraussetzungen, to: ausnahmetatbestaende, choice: arbeitnehmer_azubi, covered: false}
  - {from: freizuegigkeitsvoraussetzungen, to: ausnahmetatbestaende, choice: arbeitssuchend, covered: false}
  - {from: freizuegigkeitsvoraussetzungen, to: ausnahmetatbestaende, choice: selbststaendig, covered: false}
  - {from: freizuegigkeitsvoraussetzungen, to: ausnahmetatbestaende, choice: nicht_erwerbstaetig, covered: false}
  - {from: freizuegigkeitsvoraussetzungen, to: blocked_freizuegigkeitsvoraussetzungen_none, choice: keine, covered: false}

  - {from: ausnahmetatbestaende, to: permanently_resident_five_years, choice: dauer_der_ehe, covered: false}
  - {from: ausnahmetatbestaende, to: permanently_resident_five_years, choice: kind_der_ehem_bezugsperson, covered: false}
  - {from: ausnahmetatbestaende, to: permanently_resident_five_years, choice: umgangsrecht_fuer_kind, covered: false}
  - {from: ausnahmetatbestaende, to: permanently_resident_five_years, choice: besondere_haerte, covered: false}
  - {from: ausnahmetatbestaende, to: blocked_ausnahmetatbestaende_none, choice: keine, covered: false}

  - {from: permanently_resident_five_years, to: stays_and_absences_via_ehe_lebenspartnerschaft, choice: "yes", covered: false}
  - {from: permanently_resident_five_years, to: stays_and_absences_via_ehe_lebenspartnerschaft, choice: "no", covered: false}

  - {from: residence_permit_five_years, to: resided_five_years_with_reference_person, choice: "yes", covered: false}
  - {from: residence_permit_five_years, to: residence_permit_five_years_no_not_built, choice: "no", covered: false}

  - {from: resided_five_years_with_reference_person, to: stays_and_absences_via_five_year_permit, choice: "yes", covered: false}
  - {from: resided_five_years_with_reference_person, to: continue_staying_with_reference_person, choice: "no", covered: false}

  - {from: continue_staying_with_reference_person, to: reference_person_citizenship, choice: "yes", covered: false}
  - {from: continue_staying_with_reference_person, to: blocked_no_continue_staying, choice: "no", covered: false}

  - {from: reference_person_citizenship, to: reference_person_employed_or_looking, choice: eu, covered: false}
  - {from: reference_person_citizenship, to: rueckkehrerfaelle, choice: dtl, covered: false}
  - {from: reference_person_citizenship, to: reference_person_employed_or_looking, choice: ehe_lebenspartner_eu, covered: false}
  - {from: reference_person_citizenship, to: blocked_reference_person_other_country, choice: andere, covered: false}

  - {from: reference_person_employed_or_looking, to: family_relationship, choice: "yes", covered: false}
  - {from: reference_person_employed_or_looking, to: reference_person_employed_or_looking_no_not_built, choice: "no", covered: false}

  - {from: rueckkehrerfaelle, to: family_relationship, choice: gemeinsamer_aufenthalt_eu, covered: false}
  - {from: rueckkehrerfaelle, to: family_relationship, choice: erwerb_de_bezugsperson, covered: false}
  - {from: rueckkehrerfaelle, to: family_relationship, choice: deutsches_minderjaehriges_kind, covered: false}
  - {from: rueckkehrerfaelle, to: blocked_rueckkehrerfaelle_none, choice: keine, covered: false}

  - {from: family_relationship, to: wants_shared_dwelling, choice: ehe, covered: false}
  - {from: family_relationship, to: wants_shared_dwelling, choice: kind_unter_21, covered: false}
  - {from: family_relationship, to: wants_shared_dwelling, choice: kind_ueber_21, covered: false}
  - {from: family_relationship, to: wants_shared_dwelling, choice: fa_mit_unterhalt, covered: false}
  - {from: family_relationship, to: wants_shared_dwelling, choice: fa_ohne_unterhalt, covered: false}
  - {from: family_relationship, to: blocked_family_relationship_other, choice: andere, covered: false}

  - {from: wants_shared_dwelling, to: early_permanent_residence, choice: "yes", covered: false}
  - {from: wants_shared_dwelling, to: close_family_relationship, choice: "no", covered: false}

  - {from: close_family_relationship, to: early_permanent_residence, choice: "yes", covered: false}
  - {from: close_family_relationship, to: blocked_no_close_family_relationship, choice: "no", covered: false}

  - {from: early_permanent_residence, to: stays_and_absences_via_reference_person, choice: "yes", covered: false}
  - {from: early_permanent_residence, to: stays_and_absences_via_reference_person, choice: "no", covered: false}
  - {from: early_permanent_residence, to: stays_and_absences_via_reference_person, choice: unknown, covered: false}
