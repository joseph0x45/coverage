service: aw-auf
description: >
  Aufenthaltskarte — residence card for EU/EEA citizens and their family
  members (persons entitled to freedom of movement).

nodes:
  application_type:
    type: decision
    label: Please select your request

  nationality_group:
    type: decision
    label: I have the nationality...
  blocked_switzerland:
    type: leaf
    label: Service blocked — Swiss nationality
  blocked_non_eu_eea:
    type: leaf
    label: Service blocked — nationality outside the EU/EEA

  stay_duration:
    type: decision
    label: How long have you been staying in Germany?

  currently_employed:
    type: decision
    label: >
      (less than five years in Germany) Are you currently employed?

  previously_employed:
    type: decision
    label: Have you previously been employed in Germany or another EU/EEC country?
  blocked_never_employed:
    type: leaf
    label: Service blocked — never employed in Germany or another EU/EEC country

  retirement_reason:
    type: decision
    label: Why have you retired from working life?
  disability_pension:
    type: decision
    label: Are you entitled to a disability pension within German federal territory?
  blocked_no_disability_pension:
    type: leaf
    label: Service blocked — not entitled to a disability pension within German federal territory
  stays_and_absences_via_disability_pension:
    type: leaf
    label: Reach the "Stays and absences" page — not yet built further

  retirement_reason_reduced_capacity_not_built:
    type: leaf
    label: Retired due to a full reduction in earning capacity — not yet built
  blocked_no_retirement_reason_applies:
    type: leaf
    label: Service blocked — none of the retirement-reason statements apply

  resident_three_years:
    type: decision
    label: >
      Have you been continuously resident in German federal territory for
      at least three years?

  employed_last_12_months:
    type: decision
    label: >
      Have you engaged in any employment in German federal territory in
      the last twelve months?

  spouse_is_german_national:
    type: decision
    label: Is your spouse or civil partner a German national?

  spouse_lost_german_citizenship:
    type: decision
    label: >
      Did your spouse or partner lose German citizenship by marrying you
      before 31 March 1953?
  blocked_spouse_citizenship:
    type: leaf
    label: >
      Service blocked — spouse/partner did not lose German citizenship by
      marrying before 31 March 1953

  employment_location:
    type: decision
    label: Are you employed in Germany or another country?
  blocked_employed_germany:
    type: leaf
    label: Service blocked — employed in Germany
  blocked_employed_other_country:
    type: leaf
    label: Service blocked — employed outside the EU/EEA

  prior_work_duration:
    type: decision
    label: How long have you previously worked in Germany without interruption?
  blocked_short_prior_work:
    type: leaf
    label: Service blocked — less than three years of prior uninterrupted work

  residence_in_germany:
    type: decision
    label: Do you still have a residence in Germany?
  blocked_residence_no_weekly_return:
    type: leaf
    label: Service blocked — residence kept but no weekly return to Germany
  blocked_no_residence:
    type: leaf
    label: Service blocked — no residence kept in Germany

  stays_and_absences_via_five_years:
    type: leaf
    label: Reach the "Stays and absences" page — not yet built further
  stays_and_absences_via_residence:
    type: leaf
    label: Reach the "Stays and absences" page — not yet built further
  stays_and_absences_via_recent_employment:
    type: leaf
    label: Reach the "Stays and absences" page — not yet built further
  stays_and_absences_via_german_spouse:
    type: leaf
    label: Reach the "Stays and absences" page — not yet built further
  stays_and_absences_via_former_german_spouse:
    type: leaf
    label: Reach the "Stays and absences" page — not yet built further

  ak_not_built:
    type: leaf
    label: >
      Family member of an EU/EEA citizen requesting a residence card —
      branch not yet built

edges:
  - {from: application_type, to: nationality_group, choice: DAB, covered: false}
  - {from: application_type, to: ak_not_built, choice: AK, covered: false}

  - {from: nationality_group, to: stay_duration, choice: eu, covered: false}
  - {from: nationality_group, to: blocked_switzerland, choice: schweiz, covered: false}
  - {from: nationality_group, to: blocked_non_eu_eea, choice: not_eu, covered: false}

  - {from: stay_duration, to: stays_and_absences_via_five_years, choice: more_than_five, covered: false}
  - {from: stay_duration, to: currently_employed, choice: less_than_five, covered: false}

  - {from: currently_employed, to: employment_location, choice: "yes", covered: false}
  - {from: currently_employed, to: previously_employed, choice: "no", covered: false}

  - {from: previously_employed, to: retirement_reason, choice: "yes", covered: false}
  - {from: previously_employed, to: blocked_never_employed, choice: "no", covered: false}

  - {from: retirement_reason, to: resident_three_years, choice: ruhestand, covered: false}
  - {from: retirement_reason, to: disability_pension, choice: unfall, covered: false}
  - {from: retirement_reason, to: retirement_reason_reduced_capacity_not_built, choice: erwerbsminderung, covered: false}
  - {from: retirement_reason, to: blocked_no_retirement_reason_applies, choice: andere, covered: false}

  - {from: disability_pension, to: stays_and_absences_via_disability_pension, choice: "yes", covered: false}
  - {from: disability_pension, to: blocked_no_disability_pension, choice: "no", covered: false}

  - {from: resident_three_years, to: employed_last_12_months, choice: "yes", covered: false}
  - {from: resident_three_years, to: spouse_is_german_national, choice: "no", covered: false}

  - {from: employed_last_12_months, to: stays_and_absences_via_recent_employment, choice: "yes", covered: false}
  - {from: employed_last_12_months, to: spouse_is_german_national, choice: "no", covered: false}

  - {from: spouse_is_german_national, to: stays_and_absences_via_german_spouse, choice: "yes", covered: false}
  - {from: spouse_is_german_national, to: spouse_lost_german_citizenship, choice: "no", covered: false}

  - {from: spouse_lost_german_citizenship, to: stays_and_absences_via_former_german_spouse, choice: "yes", covered: false}
  - {from: spouse_lost_german_citizenship, to: blocked_spouse_citizenship, choice: "no", covered: false}

  - {from: employment_location, to: blocked_employed_germany, choice: germany, covered: false}
  - {from: employment_location, to: prior_work_duration, choice: eu_country, covered: false}
  - {from: employment_location, to: blocked_employed_other_country, choice: other_country, covered: false}

  - {from: prior_work_duration, to: residence_in_germany, choice: more_than_three, covered: false}
  - {from: prior_work_duration, to: blocked_short_prior_work, choice: less_than_three, covered: false}

  - {from: residence_in_germany, to: stays_and_absences_via_residence, choice: yes_mit_rueckkehr, covered: false}
  - {from: residence_in_germany, to: blocked_residence_no_weekly_return, choice: yes_ohne_rueckkehr, covered: false}
  - {from: residence_in_germany, to: blocked_no_residence, choice: "no", covered: false}
